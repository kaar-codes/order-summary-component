<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mobile.css" />
    <title>Order summary</title>
  </head>
  <body>
    <div id="root">
      <div class="card-container">
        <div class="illustration">
          <img
            src="./images/illustration-hero.svg"
            alt="A girl listening and vibing to her favorite song"
          />
        </div>
        <div class="plan">
          <div class="plan-summary">
            <h1 class="base-heading">Order Summary</h1>
            <p class="about-plan">
              You can now listen to millions of songs, audiobooks, and podcasts
              on any device anywhere you like!
            </p>
          </div>
          <div class="plan-details">
            <img src="./images/icon-music.svg" alt="music phonetic sign" />
            <div class="plan-details-amt">
              <h3 class="sub-heading">Annual Plan</h3>
              <p>&#x24;59.99/year</p>
            </div>
            <a href="#">Change</a>
          </div>
          <div class="plan-cta">
            <button class="cta btn-pay">Proceed to Payment</button>
            <button class="cta btn-cancel">Cancel Order</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
